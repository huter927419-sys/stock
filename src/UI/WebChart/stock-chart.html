<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票图表</title>
    <!-- LightweightCharts库将由C#代码嵌入 -->
    <!-- PLACEHOLDER_FOR_JS_LIBRARY -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
        }
        .header {
            background-color: #2C3E50;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .stock-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        .stock-code {
            font-size: 14px;
            color: #ECF0F1;
        }
        .chart-container {
            width: 100%;
            height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
        }
        .main-chart {
            flex: 3;
            min-height: 0;
            position: relative;
        }
        .sub-chart {
            flex: 1;
            min-height: 0;
            border-top: 1px solid #333;
            position: relative;
        }
        .sub-chart.hidden {
            display: none;
        }
        .chart-label {
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 12px;
            color: #888;
            z-index: 10;
        }
        .legend {
            position: absolute;
            top: 5px;
            right: 60px;
            font-size: 11px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .legend-color {
            width: 12px;
            height: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="stock-name" id="stockName">--</span>
        <span class="stock-code" id="stockCode">--</span>
    </div>
    <div class="chart-container">
        <div class="main-chart" id="mainChart">
            <div class="chart-label">日K线 + 成交量</div>
        </div>
        <div class="sub-chart" id="kValueChart">
            <div class="chart-label">周/月/季 K值叠加</div>
            <div class="legend" id="kValueLegend">
                <div class="legend-item"><div class="legend-color" style="background:#FF6B6B"></div><span style="color:#FF6B6B" id="weeklyKValue">周K --</span></div>
                <div class="legend-item"><div class="legend-color" style="background:#4ECDC4"></div><span style="color:#4ECDC4" id="monthlyKValue">月K --</span></div>
                <div class="legend-item"><div class="legend-color" style="background:#FFE66D"></div><span style="color:#FFE66D" id="quarterlyKValue">季K --</span></div>
            </div>
        </div>
        <div class="sub-chart hidden" id="kdBandChart">
            <div class="chart-label">KD差值带状图 (K-D)</div>
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background:#D32F2F"></div><span style="color:#D32F2F">周</span></div>
                <div class="legend-item"><div class="legend-color" style="background:#388E3C"></div><span style="color:#388E3C">月</span></div>
                <div class="legend-item"><div class="legend-color" style="background:#1976D2"></div><span style="color:#1976D2">季</span></div>
                <span style="color:#888; margin-left:10px; font-size:10px">K&gt;D深色 | K&lt;D浅色</span>
            </div>
        </div>
    </div>

    <script>
        // 图表实例
        let mainChart, kValueChart; // kdBandChart已隐藏
        let candleSeries, volumeSeries;
        // K值叠加图的系列
        let weeklyKLineSeries, monthlyKLineSeries, quarterlyKLineSeries;
        // KD带状图系列（已隐藏）
        // let kdBandChart;
        // let weeklyBandSeries, monthlyBandSeries, quarterlyBandSeries;

        // 格式化成交量数字（万、亿）
        function formatVolume(value) {
            if (value >= 100000000) {
                return (value / 100000000).toFixed(2) + '亿';
            } else if (value >= 10000) {
                return (value / 10000).toFixed(0) + '万';
            } else {
                return value.toFixed(0);
            }
        }

        // 通用图表配置
        const chartOptions = {
            layout: {
                background: { type: 'solid', color: '#1a1a2e' },
                textColor: '#DDD',
            },
            grid: {
                vertLines: { color: '#2B2B43' },
                horzLines: { color: '#2B2B43' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            rightPriceScale: {
                borderColor: '#2B2B43',
                visible: true,
                autoScale: true,
            },
            timeScale: {
                borderColor: '#2B2B43',
                visible: true,
                timeVisible: true,
                tickMarkFormatter: (time, tickMarkType, locale) => {
                    if (typeof time === 'object' && time.year) {
                        const { year, month, day } = time;
                        if (tickMarkType === 0) {
                            return `${year}`;
                        } else if (tickMarkType === 1) {
                            return `${year}-${String(month).padStart(2, '0')}`;
                        } else {
                            return `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        }
                    }
                    return String(time);
                },
            },
            localization: {
                locale: 'zh-CN',
                priceFormatter: (price) => price.toFixed(2),
                dateFormatter: (businessDayOrTimestamp) => {
                    if (typeof businessDayOrTimestamp === 'object' && businessDayOrTimestamp.year) {
                        const { year, month, day } = businessDayOrTimestamp;
                        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    }
                    return String(businessDayOrTimestamp);
                },
            },
        };

        // KD图表配置（Y轴0-100，隐藏时间轴）
        const kdChartOptions = {
            ...chartOptions,
            rightPriceScale: {
                ...chartOptions.rightPriceScale,
                visible: true,
                scaleMargins: { top: 0.1, bottom: 0.1 },
            },
            timeScale: {
                ...chartOptions.timeScale,
                visible: true,
                timeVisible: true,
            },
        };

        // 初始化所有图表
        function initCharts() {
            // 主图（K线+成交量）
            mainChart = LightweightCharts.createChart(document.getElementById('mainChart'), {
                ...chartOptions,
                height: document.getElementById('mainChart').clientHeight,
            });

            // K线
            candleSeries = mainChart.addCandlestickSeries({
                upColor: '#ef5350',
                downColor: '#26a69a',
                borderUpColor: '#ef5350',
                borderDownColor: '#26a69a',
                wickUpColor: '#ef5350',
                wickDownColor: '#26a69a',
                priceFormat: {
                    type: 'price',
                    precision: 2,
                    minMove: 0.01,
                },
            });

            // 成交量
            volumeSeries = mainChart.addHistogramSeries({
                color: '#26a69a',
                priceFormat: {
                    type: 'custom',
                    formatter: formatVolume,
                },
                priceScaleId: 'volume',
            });
            mainChart.priceScale('volume').applyOptions({
                scaleMargins: { top: 0.8, bottom: 0 },
            });
            mainChart.priceScale('right').applyOptions({
                visible: true,
                scaleMargins: { top: 0.05, bottom: 0.25 },
                borderVisible: true,
                borderColor: '#2B2B43',
                entireTextOnly: false,
                ticksVisible: true,
                drawTicks: true,
            });

            // K值叠加图
            kValueChart = LightweightCharts.createChart(document.getElementById('kValueChart'), {
                ...kdChartOptions,
                height: document.getElementById('kValueChart').clientHeight,
            });
            // 周K值 - 红色
            weeklyKLineSeries = kValueChart.addLineSeries({
                color: '#FF6B6B',
                lineWidth: 1.5,
                title: '周K',
                priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
            });
            // 月K值 - 青色
            monthlyKLineSeries = kValueChart.addLineSeries({
                color: '#4ECDC4',
                lineWidth: 1.5,
                title: '月K',
                priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
            });
            // 季K值 - 黄色
            quarterlyKLineSeries = kValueChart.addLineSeries({
                color: '#FFE66D',
                lineWidth: 1.5,
                title: '季K',
                priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
            });

            // KD带状图（已隐藏，跳过初始化以提升性能）
            // kdBandChart = LightweightCharts.createChart(document.getElementById('kdBandChart'), {
            //     ...kdChartOptions,
            //     height: document.getElementById('kdBandChart').clientHeight,
            // });
            // 
            // // 配置价格轴自动缩放
            // kdBandChart.priceScale('right').applyOptions({
            //     autoScale: true,
            //     scaleMargins: {
            //         top: 0.2,
            //         bottom: 0.2
            //     }
            // });
            // console.log('✅ KD带状图Y轴已配置');
            console.log('✅ 时间轴同步配置完成：主图表和K值图表支持同步拖动/缩放');

            // KD带状图（已隐藏，跳过初始化）
            // quarterlyBandSeries = null;
            // monthlyBandSeries = null;
            // weeklyBandSeries = null;

            // 同步所有图表的时间轴
            syncTimeScales();
            
            // 订阅十字光标移动事件，更新图例值
            subscribeCrosshairMove();
        }
        
        // 订阅十字光标移动事件，实时更新图例值
        function subscribeCrosshairMove() {
            // K值叠加图的十字光标移动
            kValueChart.subscribeCrosshairMove((param) => {
                if (param.point === undefined || !param.time) {
                    // 鼠标移出图表，显示最新值
                    updateKValueLegend(null);
                    return;
                }
                
                // 获取当前时间点的K值
                const weeklyKValue = param.seriesData.get(weeklyKLineSeries);
                const monthlyKValue = param.seriesData.get(monthlyKLineSeries);
                const quarterlyKValue = param.seriesData.get(quarterlyKLineSeries);
                
                updateKValueLegend({
                    weekly: weeklyKValue?.value,
                    monthly: monthlyKValue?.value,
                    quarterly: quarterlyKValue?.value
                });
            });
        }
        
        // 更新K值图例显示
        function updateKValueLegend(values) {
            if (values) {
                // 显示鼠标悬停位置的值
                if (values.weekly !== undefined) {
                    document.getElementById('weeklyKValue').textContent = `周K ${values.weekly.toFixed(2)}`;
                }
                if (values.monthly !== undefined) {
                    document.getElementById('monthlyKValue').textContent = `月K ${values.monthly.toFixed(2)}`;
                }
                if (values.quarterly !== undefined) {
                    document.getElementById('quarterlyKValue').textContent = `季K ${values.quarterly.toFixed(2)}`;
                }
            } else {
                // 鼠标移出，显示最新值（如果有数据）
                // 这里可以获取最后一条数据来显示
                // 暂时保持原样，或者可以添加逻辑获取最新值
            }
        }

        // 同步时间轴
        function syncTimeScales() {
            const charts = [mainChart, kValueChart, kdBandChart];
            let isSyncing = false;

            charts.forEach((chart, index) => {
                chart.timeScale().subscribeVisibleLogicalRangeChange((logicalRange) => {
                    if (isSyncing || !logicalRange) return;
                    isSyncing = true;
                    charts.forEach((otherChart, otherIndex) => {
                        if (index !== otherIndex) {
                            try {
                                otherChart.timeScale().setVisibleLogicalRange(logicalRange);
                            } catch (e) {
                                // 忽略没有数据的图表的错误
                            }
                        }
                    });
                    isSyncing = false;
                });
            });
        }

        // 设置股票信息
        function setStockInfo(name, code) {
            document.getElementById('stockName').textContent = name || '--';
            document.getElementById('stockCode').textContent = code || '--';
        }

        // 设置K线数据
        function setCandleData(data) {
            if (candleSeries && data && data.length > 0) {
                candleSeries.setData(data);
                mainChart.timeScale().fitContent();
            }
        }

        // 设置成交量数据
        function setVolumeData(data) {
            if (volumeSeries && data && data.length > 0) {
                volumeSeries.setData(data);
            }
        }

        // 设置K值叠加数据
        function setKValueData(weeklyK, monthlyK, quarterlyK) {
            console.log('📊 setKValueData called:');
            console.log(`  weeklyK: ${weeklyK?.length || 0} 条`);
            console.log(`  monthlyK: ${monthlyK?.length || 0} 条`);
            console.log(`  quarterlyK: ${quarterlyK?.length || 0} 条`);
            
            if (weeklyKLineSeries && weeklyK && weeklyK.length > 0) {
                console.log(`  ✅ 设置周K数据（${weeklyK.length}条）`);
                console.log(`  周K前3条:`, weeklyK.slice(0, 3));
                weeklyKLineSeries.setData(weeklyK);
                // 更新图例显示最新值
                const lastValue = weeklyK[weeklyK.length - 1].value;
                document.getElementById('weeklyKValue').textContent = `周K ${lastValue.toFixed(2)}`;
                console.log(`  周K最新值: ${lastValue.toFixed(2)}`);
            } else {
                console.log('  ❌ 周K数据为空或Series未初始化');
            }
            
            if (monthlyKLineSeries && monthlyK && monthlyK.length > 0) {
                console.log(`  ✅ 设置月K数据（${monthlyK.length}条）`);
                monthlyKLineSeries.setData(monthlyK);
                // 更新图例显示最新值
                const lastValue = monthlyK[monthlyK.length - 1].value;
                document.getElementById('monthlyKValue').textContent = `月K ${lastValue.toFixed(2)}`;
                console.log(`  月K最新值: ${lastValue.toFixed(2)}`);
            } else {
                console.log('  ❌ 月K数据为空或Series未初始化');
            }
            
            if (quarterlyKLineSeries && quarterlyK && quarterlyK.length > 0) {
                console.log(`  ✅ 设置季K数据（${quarterlyK.length}条）`);
                quarterlyKLineSeries.setData(quarterlyK);
                // 更新图例显示最新值
                const lastValue = quarterlyK[quarterlyK.length - 1].value;
                document.getElementById('quarterlyKValue').textContent = `季K ${lastValue.toFixed(2)}`;
                console.log(`  季K最新值: ${lastValue.toFixed(2)}`);
            } else {
                console.log('  ❌ 季K数据为空或Series未初始化');
            }
            
            console.log('📊 setKValueData completed');
        }

        // 将time对象转换为字符串key（用于Map匹配）
        function timeToKey(time) {
            if (typeof time === 'object' && time.year) {
                return `${time.year}-${String(time.month).padStart(2, '0')}-${String(time.day).padStart(2, '0')}`;
            }
            return String(time);
        }

        // 计算K-D差值用于带状图
        function calculateKDDiff(kData, dData) {
            console.log(`calculateKDDiff called: kData.length=${kData?.length || 0}, dData.length=${dData?.length || 0}`);
            
            if (!kData || !dData || kData.length === 0 || dData.length === 0) {
                console.warn(`calculateKDDiff: 数据为空 - kData.length=${kData?.length || 0}, dData.length=${dData?.length || 0}`);
                return [];
            }

            // 创建D值的映射（使用字符串key）
            const dMap = new Map();
            dData.forEach(d => {
                const key = timeToKey(d.time);
                dMap.set(key, d.value);
            });
            console.log(`  D值映射创建完成，共 ${dMap.size} 个时间点`);

            // 计算K-D差值
            let matchedCount = 0;
            let unmatchedCount = 0;
            const result = kData.map(k => {
                const key = timeToKey(k.time);
                const dValue = dMap.get(key);
                if (dValue !== undefined) {
                    matchedCount++;
                    return {
                        time: k.time,
                        value: k.value - dValue  // K-D，正值表示K>D，负值表示K<D
                    };
                } else {
                    unmatchedCount++;
                    if (unmatchedCount <= 3) {  // 只输出前3个未匹配的，避免日志过多
                        console.warn(`  未找到匹配的D值: time=${key}, K=${k.value}`);
                    }
                    return null;
                }
            }).filter(x => x !== null);

            console.log(`calculateKDDiff result: ${result.length} points (匹配: ${matchedCount}, 未匹配: ${unmatchedCount})`);
            if (result.length > 0) {
                // 计算差值的范围
                let minValue = result[0].value;
                let maxValue = result[0].value;
                for (let i = 1; i < result.length; i++) {
                    if (result[i].value < minValue) minValue = result[i].value;
                    if (result[i].value > maxValue) maxValue = result[i].value;
                }
                
                console.log(`  第一条: time=${timeToKey(result[0].time)}, value=${result[0].value.toFixed(2)}`);
                console.log(`  最后一条: time=${timeToKey(result[result.length-1].time)}, value=${result[result.length-1].value.toFixed(2)}`);
                console.log(`  📊 K-D差值范围: 最小=${minValue.toFixed(2)}, 最大=${maxValue.toFixed(2)}, 波动=${(maxValue - minValue).toFixed(2)}`);
                
                if (Math.abs(maxValue - minValue) < 0.01) {
                    console.warn(`  ⚠️ 警告: K-D差值几乎没有波动，可能导致图表显示为直线或空白！`);
                }
            } else {
                console.error('❌ calculateKDDiff: 结果为空！');
            }
            return result;
        }

        // 设置KD带状图数据
        function setKDBandData(weeklyK, weeklyD, monthlyK, monthlyD, quarterlyK, quarterlyD) {
            console.log('setKDBandData called:');
            console.log(`  weeklyK: ${weeklyK?.length || 0}, weeklyD: ${weeklyD?.length || 0}`);
            console.log(`  monthlyK: ${monthlyK?.length || 0}, monthlyD: ${monthlyD?.length || 0}`);
            console.log(`  quarterlyK: ${quarterlyK?.length || 0}, quarterlyD: ${quarterlyD?.length || 0}`);

            // 检查数据是否存在
            if (!weeklyK || !weeklyD || weeklyK.length === 0 || weeklyD.length === 0) {
                console.warn('⚠️ 周KD数据缺失，无法计算KD差值');
            }
            if (!monthlyK || !monthlyD || monthlyK.length === 0 || monthlyD.length === 0) {
                console.warn('⚠️ 月KD数据缺失，无法计算KD差值');
            }
            if (!quarterlyK || !quarterlyD || quarterlyK.length === 0 || quarterlyD.length === 0) {
                console.warn('⚠️ 季KD数据缺失，无法计算KD差值');
            }

            // 计算各周期的K-D差值
            console.log('Calculating weekly K-D diff...');
            const weeklyDiff = calculateKDDiff(weeklyK, weeklyD);
            console.log(`  Weekly diff result: ${weeklyDiff.length} points`);
            if (weeklyDiff.length > 0) {
                console.log(`  First: ${JSON.stringify(weeklyDiff[0])}`);
                console.log(`  Last: ${JSON.stringify(weeklyDiff[weeklyDiff.length - 1])}`);
            }

            console.log('Calculating monthly K-D diff...');
            const monthlyDiff = calculateKDDiff(monthlyK, monthlyD);
            console.log(`  Monthly diff result: ${monthlyDiff.length} points`);
            if (monthlyDiff.length > 0) {
                console.log(`  First: ${JSON.stringify(monthlyDiff[0])}`);
                console.log(`  Last: ${JSON.stringify(monthlyDiff[monthlyDiff.length - 1])}`);
            }

            console.log('Calculating quarterly K-D diff...');
            const quarterlyDiff = calculateKDDiff(quarterlyK, quarterlyD);
            console.log(`  Quarterly diff result: ${quarterlyDiff.length} points`);
            if (quarterlyDiff.length > 0) {
                console.log(`  First: ${JSON.stringify(quarterlyDiff[0])}`);
                console.log(`  Last: ${JSON.stringify(quarterlyDiff[quarterlyDiff.length - 1])}`);
            }

            // 设置数据到图表
            let hasData = false;
            
            if (weeklyBandSeries) {
                if (weeklyDiff.length > 0) {
                    console.log(`✅ Setting weeklyBandSeries with ${weeklyDiff.length} points`);
                    weeklyBandSeries.setData(weeklyDiff);
                    hasData = true;
                } else {
                    console.warn('⚠️ 周KD差值为空，不设置数据');
                }
            } else {
                console.error('❌ weeklyBandSeries 未初始化');
            }

            if (monthlyBandSeries) {
                if (monthlyDiff.length > 0) {
                    console.log(`✅ Setting monthlyBandSeries with ${monthlyDiff.length} points`);
                    monthlyBandSeries.setData(monthlyDiff);
                    hasData = true;
                } else {
                    console.warn('⚠️ 月KD差值为空，不设置数据');
                }
            } else {
                console.error('❌ monthlyBandSeries 未初始化');
            }

            if (quarterlyBandSeries) {
                if (quarterlyDiff.length > 0) {
                    console.log(`✅ Setting quarterlyBandSeries with ${quarterlyDiff.length} points`);
                    quarterlyBandSeries.setData(quarterlyDiff);
                    hasData = true;
                } else {
                    console.warn('⚠️ 季KD差值为空，不设置数据');
                }
            } else {
                console.error('❌ quarterlyBandSeries 未初始化');
            }
            
            // 设置数据后，调整图表显示范围
            if (hasData && kdBandChart) {
                console.log('📊 调整KD带状图显示范围...');
                kdBandChart.timeScale().fitContent();
                console.log('✅ KD带状图显示范围已调整');
            }
        }

        // 一次性设置所有数据（从C#调用）
        function setAllData(jsonData) {
            try {
                console.log('=== setAllData called ===');
                const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                
                console.log('数据解析完成:');
                console.log(`  stockName: ${data.stockName}, stockCode: ${data.stockCode}`);
                console.log(`  candles: ${data.candles?.length || 0}`);
                console.log(`  volumes: ${data.volumes?.length || 0}`);
                console.log(`  weeklyK: ${data.weeklyK?.length || 0}, weeklyD: ${data.weeklyD?.length || 0}`);
                console.log(`  monthlyK: ${data.monthlyK?.length || 0}, monthlyD: ${data.monthlyD?.length || 0}`);
                console.log(`  quarterlyK: ${data.quarterlyK?.length || 0}, quarterlyD: ${data.quarterlyD?.length || 0}`);

                if (data.stockName) setStockInfo(data.stockName, data.stockCode);
                if (data.candles) setCandleData(data.candles);
                if (data.volumes) setVolumeData(data.volumes);

                // 设置K值叠加图
                console.log('设置K值叠加图...');
                setKValueData(data.weeklyK, data.monthlyK, data.quarterlyK);

                // 设置KD带状图（已隐藏，跳过）
                // console.log('设置KD带状图...');
                // setKDBandData(
                //     data.weeklyK, data.weeklyD,
                //     data.monthlyK, data.monthlyD,
                //     data.quarterlyK, data.quarterlyD
                // );

                // 设置可见范围：显示最近300个交易日（约1.5年）
                if (data.candles && data.candles.length > 0) {
                    const totalBars = data.candles.length;
                    const visibleBars = Math.min(300, totalBars); // 显示最近300个交易日
                    const from = totalBars - visibleBars;
                    const to = totalBars - 1;
                    
                    // 设置可见逻辑范围（显示最近的数据）
                    mainChart.timeScale().setVisibleLogicalRange({
                        from: from,
                        to: to
                    });
                }

                console.log('=== setAllData completed ===');
                return 'success';
            } catch (e) {
                console.error('❌ Error setting data:', e);
                console.error('Error stack:', e.stack);
                return 'error: ' + e.message;
            }
        }

        // 窗口大小变化时重新调整图表
        window.addEventListener('resize', () => {
            if (mainChart) mainChart.resize(document.getElementById('mainChart').clientWidth, document.getElementById('mainChart').clientHeight);
            if (kValueChart) kValueChart.resize(document.getElementById('kValueChart').clientWidth, document.getElementById('kValueChart').clientHeight);
            // if (kdBandChart) kdBandChart.resize(document.getElementById('kdBandChart').clientWidth, document.getElementById('kdBandChart').clientHeight);
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', initCharts);
    </script>
</body>
</html>
